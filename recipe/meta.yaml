{% set name = "conda-lockfiles" %}
{% set version = "0.2.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 3e7ae4644b2bbc93738fcdfebd28cdc520d591cba5e8d574846a0be9be8d377a

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - hatchling >=1.12.2
    - hatch-vcs >=0.2.0
  run:
    - python
    - conda >=26.3.0
    - pydantic >=2.12.5,<3
    - ruamel.yaml

test:
  requires:
    - python
    - pip
  imports:
    - conda_lockfiles
    - conda_lockfiles.conda_lock.v1
    - conda_lockfiles.exceptions
    - conda_lockfiles.plugin
    - conda_lockfiles.rattler_lock.v6
  commands:
    - pip check

about:
  home: https://github.com/conda/conda-lockfiles
  summary: conda-lockfiles adds support for additional lockfile formats to conda.
  description: |
    Lock files record the exact state of an environment so that it can be
    reproduced at a later date or shared with collaborators. conda-lockfiles
    brings native lockfile support to conda with the ability to create and use
    lockfiles across multiple formats and platforms. With multiplatform
    support, you can solve environments once and deploy them consistently
    across Linux, macOS, and Windows.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://conda.github.io/conda-lockfiles/
  dev_url: https://github.com/conda/conda-lockfiles

extra:
  recipe-maintainers:
    - jezdez
    - kenodegard
